- type: entity
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  id: CryoLifeSupportMachine
  name: cryogenic life support
  description: a machine able to treat and maintain life inside a cryocapsule.
  components:
  # main features
  - type: CryoLifeSupport

  # machine
  - type: Machine
    board: CryoLifeSupportMachineCircuitboard

  # power
  - type: ApcPowerReceiver
    powerLoad: 3000
  - type: ExtensionCableReceiver

  # ui
  - type: UserInterface
    interfaces:
      enum.CryoLifeSupportUiKey.Key:
        type: CryoLifeSupportBoundUserInterface
  - type: ActivatableUI
    inHandsOnly: false
    key: enum.CryoLifeSupportUiKey.Key
  - type: ActivatableUIRequiresPower

  # containers
  - type: EmptyOnMachineDeconstruct
    containers:
    - lifesupport-capsule
    - lifesupport-solution
  - type: ContainerContainer
    containers:
      lifesupport-capsule:
        !type:ContainerSlot
        showEnts: true
      machine_board: !type:Container
  - type: ItemSlots
    slots:
      lifesupport-capsule:
        whitelist:
          components:
          - FitsInCryoLifeSupport
      lifesupport-solution:
        whitelist:
          components:
          - FitsInDispenser

  # atmos and piping
  - type: PipeColorVisuals
  - type: AtmosPipeColor
  - type: AtmosPipeLayers
    spriteLayersRsiPaths:
      enum.PipeVisualLayers.Pipe:
        Primary: Structures/Piping/Atmospherics/pipe.rsi
        Secondary: Structures/Piping/Atmospherics/pipe_alt1.rsi
        Tertiary: Structures/Piping/Atmospherics/pipe_alt2.rsi
  - type: AtmosDevice
  - type: NodeContainer
    nodes:
      port:
        !type:PortablePipeNode
        nodeGroupID: Pipe
        pipeDirection: South
  - type: Transform
    noRot: false

  # destruction
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: [ "Destruction" ]


  # appearance
  - type: Sprite
    sprite: _Moffstation/Structures/Machines/Medical/cryo_life_support.rsi
    state: machine
    drawdepth: FloorObjects
    layers:
    - state: pipeUnaryConnectors
      sprite: Structures/Piping/Atmospherics/pipe.rsi
      map: [ "enum.PipeVisualLayers.Pipe" ]
    - state: machine
      sprite: _Moffstation/Structures/Machines/Medical/cryo_life_support.rsi
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]

  - type: Appearance

  # audiovisual effects
  - type: AmbientSound
    volume: -9
    range: 5
    enabled: false
    sound:
      path: /Audio/Machines/spinning.ogg
  - type: PointLight
    color: "#0fbcbc"
    radius: 2
    energy: 10
    enabled: false

