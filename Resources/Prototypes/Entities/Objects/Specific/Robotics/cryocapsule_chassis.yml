## visual layers

- type: entity
  id: CryoCapsuleChassis
  name: cryogenic capsule chassis
  description: A frame with arms and legs.
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 100
        mask:
        - MobMask
        layer:
        - MobLayer
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    noRot: true
    drawdepth: Items
    sprite: _Moffstation/Mobs/Species/CryogenicCapsule/chassis.rsi
    state: chassis
  - type: Pullable

  - type: CryoCapsuleChassis
    organs:
    - OrganCryoCapsuleChassisArmLeft
    - OrganCryoCapsuleChassisHandLeft
    - OrganCryoCapsuleChassisArmRight
    - OrganCryoCapsuleChassisHandRight
    - OrganCryoCapsuleChassisLegLeft
    - OrganCryoCapsuleChassisFootLeft
    - OrganCryoCapsuleChassisLegRight
    - OrganCryoCapsuleChassisFootRight


