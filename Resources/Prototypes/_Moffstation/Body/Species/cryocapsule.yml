    - map: [ "pocket2" ]

    # Extra stuff
    - map: ["enum.HumanoidVisualLayers.Handcuffs"]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false

## Mob (Capsule)
- type: entity
  parent:
  - AppearanceCryoCapsule
  - BaseMob
  - MobRespirator
  - MobBloodstream
  - MobDamageable
  id: MobCryoCapsule
  name: cryogenic capsule
  description: a miniature cryo-pod able to keep organs alive in absence of a body.
  components:
  - type: CryoCapsule
  - type: HealBlocker # can't be injected, healed with topical or awaken via defibrillator.
  - type: Lock
    unlockOnClick: false
  - type: AccessReader
    accessLists: [ "Medical" ]
  - type: Body
  - type: DisplayableOrgans # internal organs can be seen
    organGroups:
      capsule:
        displayed: true
        categories:
        - Brain
        - Eyes
        - Tongue
        - Ears
        - Heart
        - Lungs
        - Stomach
        - Liver
        - Kidneys
        - Appendix
  - type: ReachableOrgans # internal organs can be placed and removed (when unlocked)
    insertSound: /Audio/Voice/Slime/slime_squish.ogg
    ejectSound: /Audio/Voice/Slime/slime_squish.ogg
    organGroups:
      capsule:
        exposed: false
        categories:
        - Brain
        - Eyes
        - Tongue
        - Ears
        - Heart
        - Lungs
        - Stomach
        - Liver
        - Kidneys
        - Appendix
  - type: FunctionalOrgans # presence / absence of organs affect body functions
    organGroups:
      vitals: # can't live without them
        categories:
        - Brain
        - Heart
        - Lungs
        appliedWhenAbsent:
        - StatusEffectForcedDeath
        appliedWhenPresent: []
      speech: # can't speak properly without them
        categories:
        - Tongue
        appliedWhenAbsent:
        - StatusEffectSlimeSpeech
        appliedWhenPresent: []
      vision: # can't see without them
        categories:
        - Eyes
        appliedWhenAbsent: [] # todo ! StatusEffectBlindness
        appliedWhenPresent: []
      purification: # can't purify blood without them todo !
        categories:
        - Kidneys
        - Liver
        appliedWhenAbsent: [] # todo !
        appliedWhenPresent: []
      legs: # can't move without them, can be carried
        categories:
        - LegLeft
        - LegRight
        - FootLeft
        - FootRight
        appliedWhenAbsent:
        - CryoCapsuleItemStatusEffect
        appliedWhenPresent:
        - CryoCapsuleChassisStatusEffect

  # body feature : can be installed inside a cryogenic capsule chassis
  - type: ContainerContainer
    containers:
      capsule_chassis:
        !type:ContainerSlot
  - type: ItemSlots
    slots:
      capsule_chassis:
        whitelist:
          components:
          - CryoCapsuleChassis

  # blood feature
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Cryoformol
        Quantity: 300
    bleedReductionAmount: 0 # outer layer is not skin and won't heal naturally
    bloodRefreshAmount: 0   # body don't produce Cryoformol naturally

  # damage profile
  - type: Repairable
    bloodlossModifier: -10 # stop bleeding
    damage: # same as a bruise pack
      types:
        Blunt: -5
        Piercing: -5
        Slash: -5
    doAfterDelay: 2
    fuelCost: 0.5

  - type: Damageable # your capsule is made of glass
    damageContainer: Biological
    damageModifierSet: Glass
  - type: Destructible
    thresholds:
    - trigger: # breaking your capsule will gib you instantly (200 blunt)
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 200
      behaviors:
      - !type:GibBehavior { }
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:EmptyAllContainersBehaviour
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 1500
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawnInContainer: true
        spawn:
          Ash:
            min: 1
            max: 1
      - !type:BurnBodyBehavior
      - !type:PlaySoundBehavior
        sound:
          collection: MeatLaserImpact
    - trigger:
        !type:DamageTypeTrigger
        damageType: Radiation
        damage: 15
      behaviors:
      - !type:PopupBehavior
        popup: mouth-taste-metal
        popupType: LargeCaution
        targetOnly: true

  # speech profile
  - type: Speech
    speechVerb: Slime
    speechSounds: Slime
    allowedEmotes: [ 'Squish' ]
  - type: TypingIndicator
    proto: slime
  - type: Vocal
    sounds:
      Unsexed: MaleSlime

  # others
  - type: Hunger
  - type: Thirst
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
    - CanPilot
  - type: Inventory
    templateId: cryocapsule
  - type: InventorySlots
  - type: Strippable
  - type: UserInterface # necessary for Strippable user interface
    interfaces:
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
  - type: MovementSpeedModifier
  - type: StatusIcon
    bounds: -0.5,-0.5,0.5,0.5
  - type: JobStatus
  - type: IdExaminable
  - type: Buckle
  - type: Hands
  - type: ComplexInteraction
  - type: SSDIndicator

