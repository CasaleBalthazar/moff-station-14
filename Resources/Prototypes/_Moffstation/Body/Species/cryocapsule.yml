    sprite: _Moffstation/Mobs/Species/CryogenicCapsule/parts.rsi
    layers:
    - map: [ "enum.HumanoidVisualLayers.Chest" ]
      state: capsule
    # Torso - Internal Organs
    - map: [ "enum.HumanoidExposableLayers.Kidneys" ]
    - map: [ "enum.HumanoidExposableLayers.Liver" ]
    - map: [ "enum.HumanoidExposableLayers.Stomach" ]
    - map: [ "enum.HumanoidExposableLayers.Appendix" ]
    - map: [ "enum.HumanoidExposableLayers.Lungs" ]
    - map: [ "enum.HumanoidExposableLayers.Heart" ]

    # Head
