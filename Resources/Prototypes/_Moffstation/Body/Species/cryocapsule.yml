## States (item)
- type: entity
  parent: [ StatusEffectBase ]
  id: CryoCapsuleItemStatusEffect
  components:
  - type: AddParentStatusEffect
    parents:
    - CryoCapsuleItemState

- type: entity
  id: CryoCapsuleItemState
  categories: [ HideSpawnMenu ]
  components:
  - type: BlockMovement
  - type: FitsInCryoLifeSupport
  - type: Item
    size: Ginormous
  - type: MultiHandedItem
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: HeldSpeedModifier
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake

## States (mobile)
- type: entity
  parent: [ StatusEffectBase ]
  id: CryoCapsuleChassisStatusEffect
  components:
  - type: AddParentStatusEffect
    parents:
    - CryoCapsuleChassisState

- type: entity
  id: CryoCapsuleChassisState
  categories: [ HideSpawnMenu ]
  components:
  - type: StandingState
  - type: BodyEmotes
    soundsId: GeneralBodyEmotes
  - type: CombatMode
    canDisarm: true
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    angle: 30
    animation: WeaponArcFist
    attackRate: 1
    damage:
      types:
        Blunt: 5
